# AutoUpgrade: non-CDB 19c to a PDB in an existing 26ai CDB.
# No guaranteed restore point protects a non-CDB conversion: take a full backup first.
# The copy option plugs in a COPY of the datafiles and leaves the non-CDB untouched (your fallback).
global.autoupg_log_dir=/u01/app/oracle/autoupgrade
upg1.source_home=/u01/app/oracle/product/19.0.0.0/dbhome_1
upg1.target_home=/u01/app/oracle/product/23.0.0.0/dbhome_1
upg1.sid=QUALITY
upg1.target_cdb=CDB26
upg1.target_pdb_name=QUALITY
upg1.target_pdb_copy_option=file_name_convert=('/u02/oradata/QUALITY', '/u02/oradata/CDB26/quality')
upg1.timezone_upg=yes
