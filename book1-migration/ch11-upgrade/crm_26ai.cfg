# AutoUpgrade: 19c CDB (or PDB-holding CDB) to 26ai in place on the same host.
# java -jar autoupgrade.jar -config crm_26ai.cfg -mode analyze   (read-only)
# java -jar autoupgrade.jar -config crm_26ai.cfg -mode deploy
global.autoupg_log_dir=/u01/app/oracle/autoupgrade
upg1.source_home=/u01/app/oracle/product/19.0.0.0/dbhome_1
upg1.target_home=/u01/app/oracle/product/23.0.0.0/dbhome_1
upg1.sid=CRM
upg1.restoration=yes
upg1.timezone_upg=yes
